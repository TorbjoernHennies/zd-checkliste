<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Deine Checkliste</title>
<style>
:root{--bg:#e3e7ec;--navy:#1f3566;--slate:#5f7096;--card:#f1f3f7;--gold:#d4ae3a;--goldbg:#faf3e4;--ok:#3f9a45;--okbg:#e2f2df;--rot:#b23b3b}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--navy);font-family:"Red Hat Display","Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;padding-bottom:110px}
.wrap{max-width:680px;margin:0 auto;padding:22px 16px}
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.kopf img{width:58px;border-radius:12px;flex:none}
h1{font-size:28px;line-height:1.15}
.intro{margin-top:8px;color:var(--slate);font-size:15.5px}
.termin b{white-space:nowrap}
.termin{display:inline-block;margin-top:14px;background:#fff;border:2px solid var(--navy);border-radius:999px;padding:6px 14px;font-size:14.5px}
h2{font-size:19px;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2 .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;display:grid;place-items:center}
.karte{background:#fff;border:1.5px solid #cfd6e2;border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:border-color .2s}
.karte.fertig{border-color:var(--slate)}
.karte.fehlt{border-color:var(--rot);background:#fdf3f3}
.pflicht{color:var(--rot);font-weight:700;margin-left:4px}
.karte b{display:block;font-size:16px}
.karte small{display:block;color:var(--slate);font-size:13.5px;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:7px;margin-top:10px}
.opt{border:1.5px solid var(--slate);background:var(--card);color:var(--navy);border-radius:999px;padding:9px 4px;font:inherit;font-size:14px;text-align:center;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt.an{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.an.luecke{background:var(--gold);border-color:var(--gold)}
input[type=text],textarea{width:100%;margin-top:10px;border:1.5px solid #cfd6e2;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;color:var(--navy);background:#fff}
textarea{min-height:90px;resize:vertical}
.nutzen{margin-top:20px}
.kette{display:flex;flex-direction:column;align-items:stretch;gap:0}
.kk{border-radius:18px;padding:14px 16px;text-align:center;border:2px solid var(--navy);background:#fff}
.kk .kopf2{font-size:13px;color:var(--slate);font-weight:600}
.kk .zahl{font-size:34px;font-weight:700;line-height:1.1;margin:4px 0 2px;white-space:nowrap}
.kk .sub{font-size:13px;color:var(--slate)}
.kk.k2{background:var(--goldbg);border-color:var(--gold)}
.kk.k2 .zahl{color:#8a6a06}
.kk.k3{background:var(--okbg);border-color:var(--ok)}
.kk.k3 .zahl{color:#1d6b1f;font-size:38px}
.pfeil{align-self:center;font-size:24px;line-height:1;color:var(--slate);padding:4px 0;font-weight:700}
.pfeil::before{content:"↓"}
.kzeile{text-align:center;font-weight:700;margin-top:10px;font-size:15.5px}
.kps{text-align:center;color:var(--slate);font-size:13.5px;margin-top:6px}
.kfuss{text-align:center;color:var(--slate);font-size:12px;margin-top:6px}
@media (min-width:600px){.kette{flex-direction:row;align-items:center;gap:6px}.kk{flex:1;padding:12px 8px}.kk .zahl{font-size:27px}.kk.k3 .zahl{font-size:29px}.pfeil{padding:0 2px}.pfeil::before{content:"→"}}
.regel{background:var(--goldbg);border:1.5px solid var(--gold);border-radius:16px;padding:14px 16px;font-size:15px;margin-top:28px}
.regel h3{font-size:17px;margin-bottom:6px}
.regel ul{margin:8px 0 0 18px}
.fuss{text-align:center;color:var(--slate);font-size:12.5px;margin-top:26px}
.leiste{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #cfd6e2;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.leiste .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.leiste .stand{flex:1;font-size:13.5px;color:var(--slate)}
.balken{height:6px;background:var(--card);border-radius:3px;margin-top:5px;overflow:hidden}
.balken i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.senden{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.senden:disabled{opacity:.6}
.meldung{border-radius:16px;padding:14px 16px;margin-top:18px;font-size:15px;display:none}
.meldung.an{display:block}
.meldung.ok{background:var(--okbg);border:1.5px solid var(--ok)}
.meldung.fehler{background:#f7e1e1;border:1.5px solid var(--rot)}
.status{padding:60px 0;text-align:center;color:var(--slate)}
</style></head><body>
<div class="wrap" id="app"><div class="status">Lädt …</div></div>
<div class="leiste" id="leiste" style="display:none"><div class="in"><div class="stand"><span id="stand"></span><div class="balken"><i id="balken"></i></div></div><button class="senden" id="senden">Absenden</button></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwuCUOfzCFWrqBp4HoMdlbfu_pMr19uMmReR6772AXVItk1v5w_q8VnDZ4Eb_gBkc74/exec";
const ABSCHNITTE=[{"titel": "Haus, Auto, Haftung", "items": [{"key": "haftpflicht", "label": "Privathaftpflicht", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "hausrat", "label": "Hausrat", "hint": "inkl. Fahrrad / E-Bike", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "wohngebaeude", "label": "Wohngebäude", "hint": "Trifft nicht zu, wenn dir kein Haus gehört", "opts": [["hab", "Habe ich", "hat"], ["kein", "Trifft nicht zu", null]]}, {"key": "rechtsschutz", "label": "Rechtsschutz", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "kfz", "label": "KFZ", "hint": "Auto, Motorrad, Roller. Trifft nicht zu, wenn du kein Fahrzeug hast", "opts": [["hab", "Habe ich", "hat"], ["kein", "Trifft nicht zu", null]]}, {"key": "haustier", "label": "Haustier-Versicherung", "hint": "Tierhalterhaftpflicht, Tier-Kranken- oder OP-Versicherung. Trifft nicht zu, wenn du kein Haustier hast", "opts": [["hab", "Habe ich", "hat"], ["kein", "Trifft nicht zu", null]]}, {"key": "strom", "label": "Strom & Gas", "hint": "Letzte Jahresabrechnung oder Vertragsbestätigung, wir schauen, ob es günstiger geht", "opts": [["ja", "Unterlagen schicke ich", "hinweis"], ["vermieter", "Läuft über den Vermieter", null]]}]}, {"titel": "Gesundheit und Arbeitskraft", "items": [{"key": "krankenkasse", "label": "Bei welcher Krankenkasse bist du?", "typ": "text", "placeholder": "z. B. TK, AOK, Barmer"}, {"key": "bu", "label": "Berufsunfähigkeit / Grundfähigkeit", "hint": "bei Beamten: Dienstunfähigkeit", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "unfall", "label": "Unfallversicherung", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "risikoleben", "label": "Risikolebensversicherung", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "zusatz", "label": "Krankenzusatz", "hint": "z. B. Zahn, Krankenhaus, Heilpraktiker", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}]}, {"titel": "Vorsorge und Vermögen", "items": [{"key": "altvertraege", "label": "Alte Verträge zur Altersvorsorge, die wir noch nicht kennen", "hint": "Lebensversicherung, Riester, Rürup, Betriebsrente (bAV)", "opts": [["ja", "Ja, gibt es", "hinweis"], ["keine", "Habe keine weiteren", null]]}, {"key": "bauspar", "label": "Bausparvertrag", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}, {"key": "depot", "label": "Depot, Fonds oder ETF-Sparplan", "opts": [["hab", "Habe ich", "hat"], ["nein", "Habe ich nicht", "luecke"]]}]}, {"titel": "Vermögenswirksame Leistungen (VWL)", "items": [{"key": "vwl", "label": "Zahlt dein Arbeitgeber VWL?", "hint": "Kurz beim Arbeitgeber oder in der Gehaltsabrechnung nachschauen", "opts": [["ja", "Ja", "hinweis"], ["nein", "Nein", null], ["weiss", "Weiß ich noch nicht", null]]}, {"key": "vwl_betrag", "label": "Wie viel im Monat?", "typ": "text", "optional": true, "placeholder": "z. B. 40 €, falls du es weißt"}]}, {"titel": "Noch zwei kurze Fragen", "items": [{"key": "partner", "label": "Soll ich auch die Verträge deiner Partnerin / deines Partners anschauen?", "hint": "Manche Verträge lassen sich im Haushalt zusammenlegen, so spart man sich einen gesamten Jahresbeitrag.", "opts": [["ja", "Ja, gern", "hinweis"], ["frage", "Ich frage mal", "hinweis", "fragt nach"], ["kein", "Kein Partner", null]]}, {"key": "empfehlung", "label": "Kennst du jemanden, für den so ein Check auch gut wäre?", "hint": "Dann sprechen wir im Termin kurz drüber. Namen brauchst du hier nicht einzutragen.", "opts": [["ja", "Ja, mir fällt jemand ein", "hinweis"], ["nachdenken", "Ich denke mal nach", "hinweis", "denkt nach"]]}, {"key": "sonstiges", "label": "Sonstiges, was dir noch eingefallen ist", "typ": "textarea", "optional": true, "placeholder": "Fragen, weitere Verträge, Wünsche …"}]}];
const KONF={"fristTage": 5, "erinnerungTage": 7, "nutzen": {"kacheln": [{"kopf": "Beispiel aus dem Servicetermin", "zahl": "95 €", "sub": "weniger Beiträge pro Monat, bei gleicher oder besserer Leistung"}, {"kopf": "Diese Ersparnis angelegt", "zahl": "35 Jahre", "sub": "bis zur Rente investiert"}, {"kopf": "Das Ergebnis", "zahl": "163.000 €", "sub": "mehr zur Rente"}], "zeile": "… und das ohne einen Cent mehr im Portemonnaie.", "ps": "PS: Im Beispiel waren es 6 Verträge. Je mehr Verträge wir vergleichen, desto mehr Sparpotenzial kann dabei sein.", "fuss": ""}, "danke": "<b>Danke, ist angekommen!</b> Ich bereite alles für unseren Termin vor. Schick mir deine Unterlagen gern in den nächsten Tagen, am besten bis <b>{frist}</b>. Je früher ich sie habe, desto gezielter kann ich sie prüfen und dir vorher noch Rückfragen stellen. Fehlt noch etwas an der Checkliste, kannst du sie einfach ändern und erneut absenden."};
const TAGE=['So.','Mo.','Di.','Mi.','Do.','Fr.','Sa.'];
const code=(location.hash||'').slice(1).toLowerCase();
const demo=code==='demo';
const SPEICHER='zdc-'+code;
let antworten={},daten=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parse(t){const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(t||'');return m?new Date(+m[3],+m[2]-1,+m[1]):null}
function fristVon(erstellt,termin){
  const heute=new Date();heute.setHours(0,0,0,0);
  const start=erstellt?new Date(erstellt):new Date();start.setHours(0,0,0,0);
  let f=new Date(start);f.setDate(f.getDate()+KONF.fristTage);
  const t=parse(termin);
  if(t){const c=new Date(t);c.setDate(c.getDate()-2);if(c<f)f=c}
  if(f<start)f=start;
  return f}
function fett(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function fmt(d){return TAGE[d.getDay()]+' '+('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}
function lokalLesen(){try{return JSON.parse(localStorage.getItem(SPEICHER)||'null')}catch(e){return null}}
function lokalSchreiben(){try{localStorage.setItem(SPEICHER,JSON.stringify({t:Date.now(),antworten}))}catch(e){}}
function alleItems(){return ABSCHNITTE.flatMap(a=>a.items)}
function pflichtItems(){return alleItems().filter(it=>!it.optional)}
function offene(){return pflichtItems().filter(it=>!String(antworten[it.key]||'').trim())}
function fehlerSeite(text){document.getElementById('app').innerHTML='<div class="status">'+text+'</div>'}

async function start(){
  if(!demo&&!API){fehlerSeite('Die Checkliste ist gleich startklar. Bitte probier es in Kürze nochmal.');return}
  if(!demo&&!/^[a-f0-9]{32}$/.test(code)){fehlerSeite('Dieser Link ist leider nicht vollständig. Am besten den Link aus der Mail nochmal öffnen oder kurz bei mir melden.');return}
  try{
    if(demo){daten={ok:true,anrede:'Max',termin:(()=>{const d=new Date();d.setDate(d.getDate()+14);return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()})(),antworten:{},abgesendet:'',erstellt:new Date().toISOString()}}
    else{const r=await fetch(API+'?action=get&code='+code);daten=await r.json()}
  }catch(e){fehlerSeite('Die Checkliste lässt sich gerade nicht laden. Bitte später nochmal probieren.');return}
  if(!daten||!daten.ok){fehlerSeite('Diesen Link kenne ich leider nicht (mehr). Melde dich kurz bei mir, dann schicke ich dir einen neuen.');return}
  antworten=Object.assign({},daten.antworten||{});
  const lokal=lokalLesen();
  const server=daten.abgesendet?new Date(daten.abgesendet).getTime():0;
  if(lokal&&lokal.t>server)antworten=Object.assign(antworten,lokal.antworten||{});
  zeichnen();
}

function zeichnen(){
  const d=parse(daten.termin);
  let h='<div class="kopf"><div><h1>Hallo '+esc(daten.anrede)+',</h1><p class="intro">hier ist deine Checkliste nach unserem Termin. Dauert ca. 3 Minuten: Bitte beantworte jeden Punkt. Was du nicht hast, beantwortest du einfach mit „Habe ich nicht“.</p>'+
    (d?'<div class="termin">Unser nächster Termin: <b>'+fmt(d)+'</b></div>':'')+'</div><img src="assets/zd-logo.png" alt="Zukunftsdienst"></div>'+
    '<div class="nutzen"><div class="kette">'+KONF.nutzen.kacheln.map((k,i)=>(i?'<div class="pfeil"></div>':'')+'<div class="kk k'+(i+1)+'"><div class="kopf2">'+esc(k.kopf)+'</div><div class="zahl">'+esc(k.zahl)+'</div><div class="sub">'+esc(k.sub)+'</div></div>').join('')+'</div>'+
    '<div class="kzeile">'+esc(KONF.nutzen.zeile)+'</div><div class="kps">'+esc(KONF.nutzen.ps)+'</div>'+(KONF.nutzen.fuss?'<div class="kfuss">'+esc(KONF.nutzen.fuss)+'</div>':'')+'</div>';
  ABSCHNITTE.forEach((a,ai)=>{
    h+='<h2><span class="n">'+(ai+1)+'</span>'+esc(a.titel)+'</h2>';
    a.items.forEach(it=>{
      const v=antworten[it.key]||'';
      h+='<div class="karte'+(v?' fertig':'')+'" id="k-'+it.key+'"><b>'+esc(it.label)+(it.optional?'':'<span class="pflicht">*</span>')+'</b>'+(it.hint?'<small>'+esc(it.hint)+'</small>':'');
      const typ=it.typ||'wahl';
      if(typ==='wahl')h+='<div class="opts">'+it.opts.map(o=>'<button type="button" class="opt'+(v===o[0]?' an':'')+(o[2]==='luecke'?' luecke':'')+'" data-k="'+it.key+'" data-v="'+o[0]+'">'+esc(o[1])+'</button>').join('')+'</div>';
      else if(typ==='text')h+='<input type="text" data-t="'+it.key+'" value="'+esc(v)+'" placeholder="'+esc(it.placeholder||'')+'">';
      else h+='<textarea data-t="'+it.key+'" placeholder="'+esc(it.placeholder||'')+'">'+esc(v)+'</textarea>';
      h+='</div>';
    });
  });
  h+='<div class="regel"><h3>Deine Unterlagen</h3>Pro Vertrag reichen mir <b>die ersten 3–4 Seiten vom Versicherungsschein</b>: Tarif, Leistung, Beitrag, wer versichert ist. Bei älteren Verträgen bitte auch <b>das aktuellste Beitragsschreiben</b>. AGB und Kleingedrucktes brauchst du nicht zu schicken.<ul><li>in der Kunden-App hochladen</li><li>oder abfotografieren und per WhatsApp oder Mail schicken</li></ul></div>';
  h+='<div class="meldung" id="meldung"></div>';
  h+='<p class="fuss">Deine Eingaben bleiben auf diesem Gerät gespeichert, du kannst also jederzeit später weitermachen.<br>Torbjörn Hennies · Zukunftsdienst</p>';
  document.getElementById('app').innerHTML=h;
  document.getElementById('leiste').style.display='';
  if(daten.abgesendet)meldung('ok','Du hast die Checkliste schon abgeschickt. Du kannst noch etwas ändern und erneut absenden.');
  stand();
}

function stand(){
  const items=pflichtItems(),n=items.length-offene().length;
  document.getElementById('stand').textContent=n+' von '+items.length+' beantwortet';
  document.getElementById('balken').style.width=Math.round(100*n/items.length)+'%';
}

function meldung(art,text){const m=document.getElementById('meldung');m.className='meldung an '+art;m.innerHTML=text}

document.addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const k=b.dataset.k,v=b.dataset.v;
  antworten[k]=antworten[k]===v?'':v;
  b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('an',x.dataset.v===antworten[k]));
  document.getElementById('k-'+k).classList.toggle('fertig',!!antworten[k]);
  b.closest('.karte').classList.remove('fehlt');
  lokalSchreiben();stand();
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.t;if(!k)return;antworten[k]=e.target.value;lokalSchreiben();const c=document.getElementById('k-'+k);if(c){c.classList.toggle('fertig',!!e.target.value.trim());if(e.target.value.trim())c.classList.remove('fehlt')}stand()});

document.getElementById('senden').onclick=async function(){
  const fehlt=offene();
  document.querySelectorAll('.karte.fehlt').forEach(c=>c.classList.remove('fehlt'));
  if(fehlt.length){
    fehlt.forEach(it=>document.getElementById('k-'+it.key).classList.add('fehlt'));
    meldung('fehler','Bitte noch beantworten: <b>'+fehlt.length+(fehlt.length===1?' Punkt':' Punkte')+'</b> (rot markiert). Was du nicht hast, einfach mit „Habe ich nicht“ beantworten.');
    document.getElementById('k-'+fehlt[0].key).scrollIntoView({behavior:'smooth',block:'center'});
    return}
  const btn=this;btn.disabled=true;btn.textContent='Sendet …';
  const sauber={};Object.keys(antworten).forEach(k=>{if(antworten[k])sauber[k]=antworten[k]});
  try{
    if(!demo){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code,antworten:sauber})});const j=await r.json();if(!j.ok)throw new Error(j.fehler||'fehler')}
    daten.abgesendet=new Date().toISOString();lokalSchreiben();
    meldung('ok',KONF.danke.split('{frist}').join(fmt(fristVon(daten.erstellt,daten.termin))));
  }catch(e){meldung('fehler','Das hat gerade nicht geklappt. Deine Eingaben sind gespeichert, bitte gleich nochmal auf „Absenden“ tippen.')}
  btn.disabled=false;btn.textContent='Absenden';
  document.getElementById('meldung').scrollIntoView({behavior:'smooth',block:'center'});
};
start();
</script></body></html>
